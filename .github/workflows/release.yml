name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm install -g npm@12.2.1

      - name: Verify tag matches package.json version
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Stage npm publish
        run: npm stage publish --access public

      - name: Package skills
        run: zip -r lobster-skills.zip skills/

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/lobster.js
            lobster-skills.zip
