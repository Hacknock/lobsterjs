name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm install -g npm@12.2.1

      - name: Verify tag is a stable version matching package.json
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a stable version, and this workflow publishes stable versions only"
            exit 1
          fi
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Package skills
        run: zip -r lobster-skills.zip skills/

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/lobster.js
            lobster-skills.zip
          if-no-files-found: error

      - name: Stage npm publish
        run: npm stage publish --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/lobster.js
            lobster-skills.zip
